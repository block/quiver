name: Test

on:
  pull_request:
  push:
    branches:
      - main

env:
  ENVIRONMENT: TESTING
  TERM: dumb

jobs:
  # Keep this job id as `jvm`: the branch protection on `main` requires the
  # `jvm (ubuntu-latest, ...)` check by name, even though the job now builds every target.
  jvm:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Linux builds and tests the JVM, JS, and Linux targets. macOS additionally builds and tests the Apple targets.
        os: [ubuntu-latest, macos-latest]
        cmd:
          - bin/gradle clean build -i --scan --no-daemon

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Test
        run: ${{ matrix.cmd }}

      - name: Publish Test Report
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@v2
        with:
          check_name: Test Report - ${{ matrix.os }}
          report_paths: '**/build/test-results/*/TEST-*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
